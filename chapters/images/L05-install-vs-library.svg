<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Arial, Helvetica, sans-serif">
<rect width="720" height="280" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#444441"/></marker></defs>
<text x="360" y="30" text-anchor="middle" font-size="16" fill="#2C2C2A">A package is like a reference book for your lab</text>
<rect x="25" y="60" width="190" height="120" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="120" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C2C2A">CRAN</text>
<text x="120" y="116" text-anchor="middle" font-size="13" fill="#444441">The public library</text>
<text x="120" y="136" text-anchor="middle" font-size="13" fill="#444441">(thousands of free</text>
<text x="120" y="154" text-anchor="middle" font-size="13" fill="#444441">packages)</text>
<line x1="222" y1="120" x2="268" y2="120" stroke="#444441" stroke-width="2" marker-end="url(#a)"/>
<rect x="275" y="60" width="190" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="370" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">Your bookshelf</text>
<text x="370" y="116" text-anchor="middle" font-size="13" fill="#085041">install.packages()</text>
<text x="370" y="136" text-anchor="middle" font-size="13" fill="#085041">Bring the book home</text>
<text x="370" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">ONCE per computer</text>
<line x1="472" y1="120" x2="518" y2="120" stroke="#444441" stroke-width="2" marker-end="url(#a)"/>
<rect x="525" y="60" width="170" height="120" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="610" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">Open on desk</text>
<text x="610" y="116" text-anchor="middle" font-size="13" fill="#3C3489">library()</text>
<text x="610" y="136" text-anchor="middle" font-size="13" fill="#3C3489">Take it off the shelf</text>
<text x="610" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">EVERY new session</text>
<text xml:space="preserve" x="190" y="220" font-size="14" font-family="Courier New, monospace" fill="#2C2C2A">install.packages("NHANES")   # once</text>
<text xml:space="preserve" x="190" y="245" font-size="14" font-family="Courier New, monospace" fill="#2C2C2A">library(NHANES)              # every session</text>
</svg>
