<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Arial, Helvetica, sans-serif">
<rect width="720" height="330" fill="#ffffff"/>
<text x="360" y="30" text-anchor="middle" font-size="16" fill="#2C2C2A">A matrix is a grid of one type: m[row, column]</text>
<g font-size="14">
<rect x="250" y="55" width="140" height="40" fill="#E1F5EE" stroke="#0F6E56"/><text x="320" y="80" text-anchor="middle" font-weight="bold" fill="#085041">column 1: deaths</text>
<rect x="390" y="55" width="140" height="40" fill="#E1F5EE" stroke="#0F6E56"/><text x="460" y="80" text-anchor="middle" font-weight="bold" fill="#085041">column 2: houses</text>
<rect x="40" y="95" width="210" height="50" fill="#EEEDFE" stroke="#534AB7"/><text x="145" y="125" text-anchor="middle" font-weight="bold" fill="#3C3489">row 1: Southwark_Vauxhall</text>
<rect x="40" y="145" width="210" height="50" fill="#EEEDFE" stroke="#534AB7"/><text x="145" y="175" text-anchor="middle" font-weight="bold" fill="#3C3489">row 2: Lambeth</text>
<rect x="40" y="195" width="210" height="50" fill="#EEEDFE" stroke="#534AB7"/><text x="145" y="225" text-anchor="middle" font-weight="bold" fill="#3C3489">row 3: Rest_of_London</text>
</g>
<g font-family="Courier New, monospace" font-size="17">
<rect x="250" y="95" width="140" height="50" fill="#ffffff" stroke="#888780"/><text x="320" y="126" text-anchor="middle" fill="#2C2C2A">1263</text>
<rect x="390" y="95" width="140" height="50" fill="#ffffff" stroke="#888780"/><text x="460" y="126" text-anchor="middle" fill="#2C2C2A">40046</text>
<rect x="250" y="145" width="140" height="50" fill="#FAEEDA" stroke="#854F0B" stroke-width="2.5"/><text x="320" y="176" text-anchor="middle" font-weight="bold" fill="#412402">98</text>
<rect x="390" y="145" width="140" height="50" fill="#ffffff" stroke="#888780"/><text x="460" y="176" text-anchor="middle" fill="#2C2C2A">26107</text>
<rect x="250" y="195" width="140" height="50" fill="#ffffff" stroke="#888780"/><text x="320" y="226" text-anchor="middle" fill="#2C2C2A">1422</text>
<rect x="390" y="195" width="140" height="50" fill="#ffffff" stroke="#888780"/><text x="460" y="226" text-anchor="middle" fill="#2C2C2A">256423</text>
</g>
<text x="545" y="166" font-size="13" fill="#854F0B">m[2, 1] is 98:</text>
<text x="545" y="184" font-size="13" fill="#854F0B">row 2, column 1</text>
<text xml:space="preserve" x="360" y="285" text-anchor="middle" font-size="14" font-family="Courier New, monospace" fill="#2C2C2A">m[2, ] = whole row 2     m[, "deaths"] = whole column 1</text>
<text x="360" y="310" text-anchor="middle" font-size="12" fill="#5F5E5A">Real data: Snow (1855), Table IX. Rows first, then columns, always.</text>
</svg>
