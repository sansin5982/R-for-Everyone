<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Arial, Helvetica, sans-serif">
<rect width="720" height="330" fill="#ffffff"/>
<text x="360" y="30" text-anchor="middle" font-size="16" fill="#2C2C2A">Four basic types of information in R, each with a real example</text>
<g><rect x="20" y="55" width="160" height="230" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
<text x="100" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#3C3489">numeric</text>
<text x="100" y="108" text-anchor="middle" font-size="12" fill="#534AB7">numbers with decimals</text>
<text x="100" y="160" text-anchor="middle" font-size="22" font-weight="bold" font-family="Courier New, monospace" fill="#26215C">37.5</text>
<text x="100" y="200" text-anchor="middle" font-size="12" fill="#3C3489">Lambeth cholera deaths</text>
<text x="100" y="218" text-anchor="middle" font-size="12" fill="#3C3489">per 10,000 houses</text>
<text x="100" y="262" text-anchor="middle" font-size="12" fill="#534AB7">measure, average</text></g>
<g><rect x="195" y="55" width="160" height="230" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="275" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#085041">integer</text>
<text x="275" y="108" text-anchor="middle" font-size="12" fill="#0F6E56">whole numbers</text>
<text x="275" y="160" text-anchor="middle" font-size="22" font-weight="bold" font-family="Courier New, monospace" fill="#04342C">2523L</text>
<text x="275" y="200" text-anchor="middle" font-size="12" fill="#085041">A birth weight in grams</text>
<text x="275" y="218" text-anchor="middle" font-size="12" fill="#085041">(birthwt, 1986)</text>
<text x="275" y="262" text-anchor="middle" font-size="12" fill="#0F6E56">count, code</text></g>
<g><rect x="370" y="55" width="160" height="230" rx="10" fill="#FAEEDA" stroke="#854F0B"/>
<text x="450" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#633806">character</text>
<text x="450" y="108" text-anchor="middle" font-size="12" fill="#854F0B">text, in quotes</text>
<text x="450" y="160" text-anchor="middle" font-size="18" font-weight="bold" font-family="Courier New, monospace" fill="#412402">"rs4988235"</text>
<text x="450" y="200" text-anchor="middle" font-size="12" fill="#633806">Name of a genetic variant</text>
<text x="450" y="218" text-anchor="middle" font-size="12" fill="#633806">near the lactase gene</text>
<text x="450" y="262" text-anchor="middle" font-size="12" fill="#854F0B">name, ID, label</text></g>
<g><rect x="545" y="55" width="160" height="230" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="625" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#712B13">logical</text>
<text x="625" y="108" text-anchor="middle" font-size="12" fill="#993C1D">TRUE or FALSE only</text>
<text x="625" y="160" text-anchor="middle" font-size="22" font-weight="bold" font-family="Courier New, monospace" fill="#4A1B0C">TRUE</text>
<text x="625" y="200" text-anchor="middle" font-size="12" fill="#712B13">Is this baby under</text>
<text x="625" y="218" text-anchor="middle" font-size="12" fill="#712B13">2,500 grams?</text>
<text x="625" y="262" text-anchor="middle" font-size="12" fill="#993C1D">yes/no answer</text></g>
<text x="360" y="315" text-anchor="middle" font-size="13" fill="#5F5E5A">Check any value with class(): class(37.5) gives "numeric", class("rs4988235") gives "character"</text>
</svg>
